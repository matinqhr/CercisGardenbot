name: Cercis Mini App Build

on:
  push:
    branches:
      - feature/mini-game
  pull_request:
    paths:
      - "mini-app/**"
      - ".github/workflows/mini-app-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
